<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KS仮クイズ</title>

    <style>

        body{
            margin:0;
            background:#111;
            color:white;
            font-family:sans-serif;
            overflow:hidden;
            text-align:center;
        }

        h1{
            margin-top:20px;
            font-size:48px;
        }

        #info{
            font-size:24px;
            margin-top:10px;
            color:#ccc;
        }

        #gameArea{
            position:relative;
            width:100vw;
            height:80vh;

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;
        }

        #questionImage{
            max-width:80%;
            max-height:80%;

            transition:all 0.2s linear;

            image-rendering:pixelated;
        }

        #tileOverlay{
            position:absolute;

            width:80%;
            height:80%;

            display:grid;

            pointer-events:none;
        }

        .tile{
            background:#111;
            border:1px solid #222;
        }

        #modeDisplay{
            position:absolute;

            top:20px;
            left:20px;

            font-size:28px;

            background:rgba(0,0,0,0.5);

            padding:10px 20px;

            border-radius:10px;
        }

        #startButton{
            padding:20px 40px;

            font-size:32px;

            border:none;
            border-radius:20px;

            cursor:pointer;

            background:#00aaff;
            color:white;

            transition:0.2s;
        }

        #startButton:hover{
            transform:scale(1.05);
        }

    </style>
</head>

<body>

    <h1>KS仮クイズ</h1>

    <div id="info">
        1〜4キーでモード選択 → Spaceで開始
    </div>

    <div id="modeDisplay">
        モード：未選択
    </div>

    <button id="startButton">
        スタート
    </button>

    <div id="gameArea" style="display:none;">

        <img id="questionImage" src="images/q1.png">

        <div id="tileOverlay"></div>

    </div>

    <script>

        const image = document.getElementById("questionImage");
        const gameArea = document.getElementById("gameArea");
        const modeDisplay = document.getElementById("modeDisplay");
        const startButton = document.getElementById("startButton");
        const tileOverlay = document.getElementById("tileOverlay");


        // 問題一覧
        const questions = [
            {
                image:"images/q1.png"
            },
            {
                image:"images/q2.png"
            },
            {
                image:"images/q3.png"
            }
        ];


        let currentQuestion = 0;
        let selectedMode = 0;
        let running = false;
        let interval;


        // モード名
        const modeNames = {

            1:"モザイク解除",
            2:"ズームアウト",
            3:"タイル解除",
            4:"鮮明化"

        };


        // スタートボタン
        startButton.addEventListener("click", () => {

            gameArea.style.display = "flex";

            startButton.style.display = "none";

        });


        // キー入力
        document.addEventListener("keydown", (e) => {


            // モード選択
            if(e.key >= "1" && e.key <= "4"){

                selectedMode = Number(e.key);

                modeDisplay.textContent =
                    "モード：" + modeNames[selectedMode];
            }


            // Spaceで開始
            if(e.code === "Space"){

                if(selectedMode !== 0 && !running){

                    startQuestion();
                }
            }

        });


        // 問題開始
        function startQuestion(){

            running = true;

            clearInterval(interval);

            tileOverlay.innerHTML = "";

            image.style.filter = "none";
            image.style.transform = "scale(1)";

            image.src = questions[currentQuestion].image;


            switch(selectedMode){

                case 1:
                    startMosaicMode();
                    break;

                case 2:
                    startZoomMode();
                    break;

                case 3:
                    startTileMode();
                    break;

                case 4:
                    startBlurMode();
                    break;
            }
        }



        // =====================================
        // 1. モザイク解除
        // =====================================

        function startMosaicMode(){

            let scale = 8;

            interval = setInterval(() => {

                image.style.transform =
                    `scale(${scale})`;

                scale -= 0.3;

                if(scale <= 1){

                    image.style.transform = "scale(1)";

                    clearInterval(interval);

                    running = false;
                }

            }, 150);
        }



        // =====================================
        // 2. ズームアウト
        // =====================================

        function startZoomMode(){

            let scale = 6;

            interval = setInterval(() => {

                image.style.transform =
                    `scale(${scale})`;

                scale -= 0.2;

                if(scale <= 1){

                    image.style.transform = "scale(1)";

                    clearInterval(interval);

                    running = false;
                }

            }, 120);
        }



        // =====================================
        // 3. タイル解除
        // =====================================

        function startTileMode(){

            const rows = 8;
            const cols = 8;

            tileOverlay.style.gridTemplateColumns =
                `repeat(${cols}, 1fr)`;

            tileOverlay.style.gridTemplateRows =
                `repeat(${rows}, 1fr)`;


            const tiles = [];


            for(let i = 0; i < rows * cols; i++){

                const tile = document.createElement("div");

                tile.classList.add("tile");

                tileOverlay.appendChild(tile);

                tiles.push(tile);
            }


            interval = setInterval(() => {

                if(tiles.length <= 0){

                    clearInterval(interval);

                    running = false;

                    return;
                }


                const randomIndex =
                    Math.floor(Math.random() * tiles.length);

                tiles[randomIndex].remove();

                tiles.splice(randomIndex, 1);

            }, 100);

        }



        // =====================================
        // 4. 鮮明化
        // =====================================

        function startBlurMode(){

            let blur = 30;

            interval = setInterval(() => {

                image.style.filter =
                    `blur(${blur}px)`;

                blur -= 1;

                if(blur <= 0){

                    image.style.filter = "blur(0px)";

                    clearInterval(interval);

                    running = false;
                }

            }, 120);

        }

    </script>

</body>
</html>
