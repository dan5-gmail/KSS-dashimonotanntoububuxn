<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KSKQZ</title>

    <style>

        body{
            margin:0;
            background:#cc3031;
            color:white;
            font-family:sans-serif;
            overflow:hidden;
            text-align:center;

            transition:0.3s;
        }

        h1{
            margin-top:20px;
            font-size:48px;
        }

        #info{
            font-size:24px;
            margin-top:10px;
            color:#ccc;
            line-height:1.7;
        }

        #gameArea{
            position:relative;
            width:100vw;
            height:80vh;

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;
        }

        #questionImage{
            max-width:80%;
            max-height:80%;

            transition:all 0.2s linear;

            image-rendering:pixelated;
        }

        #tileOverlay{
            position:absolute;

            width:80%;
            height:80%;

            display:grid;

            pointer-events:none;
        }

        #questionText{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    font-size:72px;
    font-weight:bold;

    color:white;

    text-shadow:
        0 0 10px black,
        0 0 20px black,
        0 0 30px black;

    display:none;

    z-index:100;
}

        #answerText{

    position:absolute;

    bottom:50px;
    left:50%;

    transform:translateX(-50%);

    font-size:48px;
    font-weight:bold;

    color:yellow;

    text-shadow:
        0 0 10px black,
        0 0 20px black;

    display:none;

    z-index:100;
}
        

        .tile{
            background:#111;
            border:1px solid #222;
        }

        #modeDisplay{
            position:absolute;

            top:20px;
            left:20px;

            font-size:28px;

            background:rgba(0,0,0,0.5);

            padding:10px 20px;

            border-radius:10px;
        }

        #startButton{
            padding:20px 40px;

            font-size:32px;

            border:none;
            border-radius:20px;

            cursor:pointer;

            background:#00aaff;
            color:white;

            transition:0.2s;
        }

        #startButton:hover{
            transform:scale(1.05);
        }

    </style>
</head>

<body>

    <h1 id="title">KSF 仮  TEST123</h1>

    <div id="info">
        1〜4キー = モード選択 → Space = 開始<br>
        Shift = 一時停止 / 再開<br>
        Nキー = ランダムに問題を出題<br>
        Cキー = 背景変更<br>
        Hキー = UI表示切替<br>
        Fキー = 全画面
    </div>

    <div id="modeDisplay">
        モード：未選択

    <button id="startButton">

    <script>

alert("3");

        const image = document.getElementById("questionImage");

        const difficultyDisplay =
          document.getElementById("difficultyDisplay");
        
        const startButton = document.getElementById("startButton");

        const info = document.getElementById("info");
        const title = document.getElementById("title");

        const questionText =
            document.getElementById("questionText");

        const answerText =
    document.getElementById("answerText");



        // =====================================

        let uiVisible = true;


        // =====================================

        let paused = false;


        // =====================================

        // =====================================

        const bgModes = [

                linear-gradient(#7a2b2b 2px, transparent 2px),

            }

        ];

        let bgIndex = 0;
// =====================================
// 問題一覧
// =====================================

const questions = {
    1: [],
    2: [],
    3: []
};
        const answers = {

    "q91.PNG": "リンゴ",

    "q93.PNG": "ピーマン",
    "q94.PNG": "キャベツ",
    "q95.PNG": "リンゴ",
    "q96.PNG": "カボチャ",
    "q97.PNG": "ピーマン",
    "q98.PNG": "キャベツ",
    "q99.PNG": "カボチャ",
    "q100.PNG": "ピーマン",
};

// q1.png ～ q33.png
for(let i = 1; i <= 57; i++){
    questions[1].push(`q${i}.PNG`);
}

// q34.png ～ q66.png
for(let i = 58; i <= 66; i++){
    questions[2].push(`q${i}.PNG`);
}

// q67.png ～ q100.png
for(let i = 67; i <= 100; i++){
    questions[3].push(`q${i}.PNG`);
}


// =====================================
// 難易度
// =====================================

let selectedDifficulty = 1; //難易度

// =====================================
// 連続重複防止
// =====================================

        let lastQuestion = "";
// 現在表示中の画像
let currentImage = "";

let currentAnswer = "";


// =====================================
// ランダム取得
// =====================================

function getRandomQuestion(){

    const list = questions[selectedDifficulty];

    let imageName;

    do{

        imageName =
            list[Math.floor(Math.random() * list.length)];

    }while(
        list.length > 1 &&
        imageName === lastQuestion
    );

    lastQuestion = imageName;

    currentAnswer =
    imageName.replace(".PNG", "");

    return imageName; 
}
        let currentQuestion = 0;
        let selectedMode = 0;
        let running = false;
        let interval;


        // =====================================
        // モード名
        // =====================================

        const modeNames = {

            1:"モザイク解除",
            2:"ズームアウト",
            3:"タイル解除",
            4:"鮮明化"

        };


        // =====================================
        // スタートボタン
        // =====================================

        startButton.addEventListener("click", () => {

            gameArea.style.display = "flex";

            startButton.style.display = "none";

        });


        // =====================================
        // キー入力
        // =====================================

        document.addEventListener("keydown", (e) => {

// =====================================
// 難易度選択
// =====================================

if(e.key === "5"){

    selectedDifficulty = 1;

    difficultyDisplay.textContent =
        "難易度：1";
}

if(e.key === "6"){

    selectedDifficulty = 2;

    difficultyDisplay.textContent =
        "難易度：2";
}

if(e.key === "7"){

    selectedDifficulty = 3;

    difficultyDisplay.textContent =
        "難易度：3";
}

            // =====================================
            // モード選択
            // =====================================

            if(e.key >= "1" && e.key <= "4"){

                selectedMode = Number(e.key);

                modeDisplay.textContent =
                    "モード：" + modeNames[selectedMode];
                    }


            // =====================================
            // Spaceで開始
            // =====================================

            if(e.code === "Space"){

                if(selectedMode !== 0 && !running){

                    startQuestion();
                }
            }

// =====================================
// Shiftで停止 / 再開 + 画像非表示
// =====================================

if(e.key === "Shift"){

    if(running){

        paused = !paused;

        if(paused){

               image.style.visibility = "hidden";

              tileOverlay.style.visibility = "hidden";
 
              questionText.style.display = "block";

         }else{

            image.style.visibility = "visible";

            tileOverlay.style.visibility = "visible";

            questionText.style.display = "none";  
       }
    }
}

            // =====================================
            // Nキーで次の問題
            // =====================================

            if(e.key === "n"){

                if(!running){

                    nextQuestion();
                }
            }


            // =====================================
            // Cキーで背景変更
            // =====================================

            if(e.key === "c"){

                bgIndex++;

                if(bgIndex >= bgModes.length){

                    bgIndex = 0;
                }

                document.body.style.backgroundColor =
                    bgModes[bgIndex].color;

                document.body.style.backgroundImage =
                    bgModes[bgIndex].image;

                document.body.style.backgroundSize =
                    "80px 40px";
            }


            // =====================================
            // HキーでUI表示切替
            // =====================================

            if(e.key === "h"){

                uiVisible = !uiVisible;

                if(uiVisible){

                    info.style.display = "block";
                    modeDisplay.style.display = "block";
                    title.style.display = "block";

                }else{

                    info.style.display = "none";
                    modeDisplay.style.display = "none";
                    title.style.display = "none";
                }
            }


            // =====================================
            // Fキーで全画面切替
            // =====================================

            if(e.key === "f"){

                if(!document.fullscreenElement){

                    document.documentElement.requestFullscreen();

                }else{

                    document.exitFullscreen();
                }
            }

            //==================
            //Aで回答表示
            //==================

            if(e.key === "a"){

    answerText.textContent =
        "答え : " +
        (answers[currentImage] || "未登録");

    answerText.style.display =
        "block";
}


        // =====================================
        // 問題開始
        // =====================================

        function startQuestion(){

    running = true;
    paused = false;

    questionText.style.display = "none";

    image.style.visibility = "visible";
    tileOverlay.style.visibility = "visible";

            clearInterval(interval);

            tileOverlay.innerHTML = "";

            image.style.display = "block";

currentImage = getRandomQuestion();

image.src = currentImage;

image.style.filter = "none";

            image.style.filter = "none";
            image.style.transform = "scale(1)";


            switch(selectedMode){

                case 1:

                    image.style.filter = "blur(30px)";
                    startMosaicMode();
                    break;

                case 2:

                    image.style.transform = "scale(7)";
                    startZoomMode();
                    break;

                case 3:

                    startTileMode();
                    break;

                case 4:

                    image.style.filter =
                        "grayscale(100%) saturate(0%) brightness(50%)";

                    startBlurMode();
                    break;
            }
        }


        // =====================================
        // 次の問題
        // =====================================

        function nextQuestion(){

            currentImage = getRandomQuestion();

            image.src = currentImage;

            answerText.style.display = "none";
            
         image.style.visibility = "visible";
         tileOverlay.style.visibility = "visible";

         questionText.style.display = "none";
}

        // =====================================
        // 1. モザイク解除
        // =====================================

        function startMosaicMode(){

            let blur = 30;

            interval = setInterval(() => {

                if(paused) return;

                image.style.filter =
                    `blur(${blur}px)`;

                blur -= 0.8;

                if(blur <= 0){

                    image.style.filter = "blur(0px)";

                    clearInterval(interval);

                    running = false;
                }

            }, 180);
        }


        // =====================================
        // 2. ズームアウト
        // =====================================

        function startZoomMode(){

            let scale = 7;

            interval = setInterval(() => {

                if(paused) return;

                image.style.transform =
                    `scale(${scale})`;

                scale -= 0.08;

                if(scale <= 1){

                    image.style.transform = "scale(1)";

                    clearInterval(interval);

                    running = false;
                }

            }, 150);
        }


        // =====================================
        // 3. タイル解除
        // =====================================

        function startTileMode(){

            const rows = 8;
            const cols = 8;

            tileOverlay.style.gridTemplateColumns =
                `repeat(${cols}, 1fr)`;

            tileOverlay.style.gridTemplateRows =
                `repeat(${rows}, 1fr)`;


            const tiles = [];


            for(let i = 0; i < rows * cols; i++){

                const tile = document.createElement("div");

                tile.classList.add("tile");

                tileOverlay.appendChild(tile);

                tiles.push(tile);
            }


            interval = setInterval(() => {

                if(paused) return;

                if(tiles.length <= 0){

                    clearInterval(interval);

                    running = false;

                    return;
                }


                const randomIndex =
                    Math.floor(Math.random() * tiles.length);

                tiles[randomIndex].remove();

                tiles.splice(randomIndex, 1);

            }, 100);

        }


        // =====================================
        // 4. 鮮明化
        // =====================================

        function startBlurMode(){

            let saturation = 0;

            interval = setInterval(() => {

                if(paused) return;

                image.style.filter =
                    `grayscale(${100 - saturation}%)
                     saturate(${saturation}%)
                     brightness(${50 + saturation / 2}%)`;

                saturation += 2;

                if(saturation >= 100){

                    image.style.filter =
                        "grayscale(0%) saturate(100%) brightness(100%)";

                    clearInterval(interval);

                    running = false;
                }

            }, 120);

        }

    </script>
