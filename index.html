<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KSKQS</title>

    <style>

        body{
            margin:0;
            background:#111;
            color:white;
            font-family:sans-serif;
            overflow:hidden;
            text-align:center;
        }

        h1{
            margin-top:20px;
            font-size:48px;
        }

        #info{
            font-size:24px;
            margin-top:10px;
            color:#ccc;
        }

        #gameArea{
            position:relative;
            width:100vw;
            height:80vh;

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;
        }

        #questionImage{
            max-width:80%;
            max-height:80%;

            transition:all 0.2s linear;

            image-rendering:pixelated;
        }

        #tileOverlay{
            position:absolute;

            width:80%;
            height:80%;

            display:grid;

            pointer-events:none;
        }

        .tile{
            background:#111;
            border:1px solid #222;
        }

        #modeDisplay{
            position:absolute;

            top:20px;
            left:20px;

            font-size:28px;

            background:rgba(0,0,0,0.5);

            padding:10px 20px;

            border-radius:10px;
        }

        #startButton{
            padding:20px 40px;

            font-size:32px;

            border:none;
            border-radius:20px;

            cursor:pointer;

            background:#00aaff;
            color:white;

            transition:0.2s;
        }

        #startButton:hover{
            transform:scale(1.05);
        }

    </style>
</head>

<body>

    <h1>I like sushi You like???? REALLY???</h1>

    <div id="info">
        1〜4キーでモード選択 → Spaceで開始
    </div>

    <div id="modeDisplay">
        モード：未選択
    </div>

    <button id="startButton">
        スタート
    </button>

    <div id="gameArea" style="display:none;">


        <img id="questionImage" src="" style="display:none;">

        <div id="tileOverlay"></div>

    </div>

    <script>

        const image = document.getElementById("questionImage");
        const gameArea = document.getElementById("gameArea");
        const modeDisplay = document.getElementById("modeDisplay");
        const startButton = document.getElementById("startButton");
        const tileOverlay = document.getElementById("tileOverlay");


        // =====================================
        // 問題一覧
        // =====================================

        const questions = [

            { image:"q1.png" },
            { image:"q2.png" },
            { image:"q3.png" },
            { image:"q4.png" },
            { image:"q5.png" },
            { image:"q6.png" },
            { image:"q7.png" },
            { image:"q8.png" },
            { image:"q9.png" },
            { image:"q10.png" },
            { image:"q11.png" },
            { image:"q12.png" },
            { image:"q13.png" },           
            { image:"q14.png" },
            { image:"q15.png" },
            { image:"q16.png" },
            { image:"q17.png" },
            { image:"q18.png" },
            { image:"q19.png" },
            { image:"q20.png" },
            { image:"q21.png" },
            { image:"q22.png" },
            { image:"q23.png" },
            { image:"q24.png" },
            { image:"q25.png" },
            { image:"q26.png" },
            { image:"q27.png" },
            { image:"q28.png" },
            { image:"q29.png" },
            { image:"q30.png" },
            { image:"q31.png" },
            { image:"q32.png" },
            { image:"q33.png" },
            { image:"q34.png" },
            { image:"q35.png" },
            { image:"q36.png" },
            { image:"q37.png" },
            { image:"q38.png" },
            { image:"q39.png" },
            { image:"q40.png" },
            { image:"q41.png" },
            { image:"q42.png" },
            { image:"q43.png" },
            { image:"q44.png" },
            { image:"q45.png" },
            { image:"q46.png" },
            { image:"q47.png" },
            { image:"q48.png" },
            { image:"q49.png" },
            { image:"q50.png" },
//--------------------------------------------50-------------------------------------------------
            { image:"q51.png" },
            { image:"q52.png" },
            { image:"q53.png" },
            { image:"q54.png" },
            { image:"q55.png" },
            { image:"q56.png" },
            { image:"q57.png" },
            { image:"q58.png" },
            { image:"q59.png" },
            { image:"q60.png" },
            { image:"q61.png" },
            { image:"q62.png" },
            { image:"q63.png" },           
            { image:"q64.png" },
            { image:"q65.png" },
            { image:"q66.png" },
            { image:"q67.png" },
            { image:"q68.png" },
            { image:"q69.png" },
            { image:"q70.png" },

            { image:"q72.png" },
            { image:"q73.png" },
            { image:"q74.png" },

            { image:"q76.png" },
            { image:"q77.png" },
            { image:"q78.png" },
            { image:"q79.png" },
            { image:"q80.png" },
            { image:"q81.png" },
            { image:"q82.png" },
            { image:"q83.png" },
            { image:"q84.png" },
            { image:"q85.png" },
            { image:"q86.png" },
            { image:"q87.png" },
            { image:"q88.png" },
            { image:"q89.png" },
            { image:"q90.png" },
            { image:"q91.png" },
            { image:"q92.png" },
            { image:"q93.png" },
            { image:"q94.png" },
            { image:"q95.png" },
            { image:"q96.png" },
            { image:"q97.png" },
            { image:"q98.png" },
            { image:"q99.png" },
            { image:"q100.png"}
//--------------------------------------100----------------------------------------------
        ];


        let currentQuestion = 0;
        let selectedMode = 0;
        let running = false;
        let interval;


        // =====================================
        // モード名
        // =====================================

        const modeNames = {

            1:"モザイク解除",
            2:"ズームアウト",
            3:"タイル解除",
            4:"鮮明化"

        };


        // =====================================
        // スタートボタン
        // =====================================

        startButton.addEventListener("click", () => {

            gameArea.style.display = "flex";

            startButton.style.display = "none";

        });


        // =====================================
        // キー入力
        // =====================================

        document.addEventListener("keydown", (e) => {

            // モード選択
            if(e.key >= "1" && e.key <= "4"){

                selectedMode = Number(e.key);

                modeDisplay.textContent =
                    "モード：" + modeNames[selectedMode];
            }


            // Spaceで開始
            if(e.code === "Space"){

                if(selectedMode !== 0 && !running){

                    startQuestion();
                }
            }


            // Nキーで次の問題
            if(e.key === "n"){

                if(!running){
                nextQuestion();
                }
            }

        });


        // =====================================
        // 問題開始
        // =====================================

        function startQuestion(){

            running = true;

            clearInterval(interval);

            tileOverlay.innerHTML = "";

            image.style.display = "block";

            // 現在の問題画像へ変更
            image.src = questions[currentQuestion].image;

            // 初期化
            
            image.style.filter = "none";
            image.style.transform = "scale(1)";


            switch(selectedMode){

                case 1:

                    image.style.filter = "blur(30px)";
                    startMosaicMode();
                    break;

                case 2:
                    
                    image.style.transform = "scale(7)";
                    startZoomMode();
                    break;

                case 3:
                    
                    startTileMode();
                    break;

                case 4:
                    
                    image.style.filter = "grayscale(100%) saturate(0%) brightness";
                    startBlurMode();
                    break;
            }
        }


        // =====================================
        // 次の問題
        // =====================================

        function nextQuestion(){

            currentQuestion++;

            // 最後まで行ったら最初へ戻る
            if(currentQuestion >= questions.length){

                currentQuestion = 0;
            }

            image.src = questions[currentQuestion].image;
        }


        // =====================================
        // 1. モザイク解除
        // =====================================

        function startMosaicMode(){

            let blur = 30;

            interval = setInterval(() => {

                image.style.filter =
                    `blur(${blur}px)`;

                blur -= 0.8;

                if(blur <= 0){

                    image.style.filter = "blur(0px)";

                    clearInterval(interval);

                    running = false;
                }

            }, 180);
        }


        // =====================================
        // 2. ズームアウト
        // =====================================

        function startZoomMode(){

            let scale = 7;

            interval = setInterval(() => {

                image.style.transform =
                    `scale(${scale})`;

                scale -= 0.08;

                if(scale <= 1){

                    image.style.transform = "scale(1)";

                    clearInterval(interval);

                    running = false;
                }

            }, 150);
        }


        // =====================================
        // 3. タイル解除
        // =====================================

        function startTileMode(){

            const rows = 8;
            const cols = 8;

            tileOverlay.style.gridTemplateColumns =
                `repeat(${cols}, 1fr)`;

            tileOverlay.style.gridTemplateRows =
                `repeat(${rows}, 1fr)`;


            const tiles = [];


            for(let i = 0; i < rows * cols; i++){

                const tile = document.createElement("div");

                tile.classList.add("tile");

                tileOverlay.appendChild(tile);

                tiles.push(tile);
            }


            interval = setInterval(() => {

                if(tiles.length <= 0){

                    clearInterval(interval);

                    running = false;

                    return;
                }


                const randomIndex =
                    Math.floor(Math.random() * tiles.length);

                tiles[randomIndex].remove();

                tiles.splice(randomIndex, 1);

            }, 100);

        }


        // =====================================
        // 4. 鮮明化
        // =====================================

        function startBlurMode(){

            let saturation = 0;

            interval = setInterval(() => {

                image.style.filter =
                    `grayscale(${100 - saturation}%)
                     saturate(${saturation}%)
                     brightness(${50 + saturation / 2}%)`;

                saturation += 2;

                if(saturation >= 100){

                    image.style.filter =
                        "grayscale(0%) saturate(100%) brightness(100%)";

                    clearInterval(interval);

                    running = false;
                }

            }, 120);

        }

    </script>

</body>
</html>
